<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .dashboard-container {
            padding: 20px;
        }
        .order-card {
            margin-bottom: 15px;
            border-left: 4px solid #0d6efd;
        }
        .done {
            border-left-color: #198754;
        }
        .nav-link.active {
            font-weight: bold;
        }
    </style>
</head>
<body>
    
    <!-- Login Section -->
    <div id="login-section" class="login-container">
        <h2 class="text-center mb-4">Admin Login</h2>
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" placeholder="Enter username">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter password">
        </div>
        <button id="login-btn" class="btn btn-primary w-100">Login</button>
        <div id="login-error" class="text-danger mt-2 text-center"></div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="dashboard-container" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Admin Dashboard</h2>
            <button id="logout-btn" class="btn btn-outline-danger">Logout</button>
        </div>
        
        <ul class="nav nav-tabs mb-4" id="dashboardTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="users-tab" data-bs-toggle="tab" data-bs-target="#users" type="button" role="tab">Users</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="orders-tab" data-bs-toggle="tab" data-bs-target="#orders" type="button" role="tab">Orders</button>
            </li>
                        <li class="nav-item" role="presentation">
                <button class="nav-link" id="products-tab" data-bs-toggle="tab" data-bs-target="#products" type="button" role="tab">Products</button>
            </li>
        </ul>
        
        <div class="tab-content" id="dashboardTabsContent">
            <div class="tab-pane fade show active" id="users" role="tabpanel">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Address</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <!-- Users will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="tab-pane fade" id="orders" role="tabpanel">
                <div id="orders-container">
                    <div class="alert alert-info" id="no-orders-message">
                        Select a user to view their orders
                    </div>
                    <div id="orders-list">
                        <!-- Orders will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Order Details Modal -->
    <div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Order Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="order-details-content">
                    <!-- Order details will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" id="mark-done-btn" class="btn btn-success">Mark as Done</button>
                </div>
            </div>
        </div>
    </div>
<div class="tab-pane fade" id="products" role="tabpanel">
                <div class="row">
                    <div class="col-md-3">
                        <div class="list-group">
                            <a href="#" class="list-group-item list-group-item-action active" data-category="shirts">Shirts</a>
                            <a href="#" class="list-group-item list-group-item-action" data-category="tshirts">T-Shirts</a>
                            <a href="#" class="list-group-item list-group-item-action" data-category="pants-jeans">Pants & Jeans</a>
                            <a href="#" class="list-group-item list-group-item-action" data-category="ethnic-wear">Ethnic Wear</a>
                            <a href="#" class="list-group-item list-group-item-action" data-category="jackets-hoodies">Jackets & Hoodies</a>
                        </div>
                    </div>
                    <div class="col-md-9">
                        <div class="d-flex justify-content-between mb-3">
                            <h4 id="current-category">Shirts</h4>
                            <button id="add-product-btn" class="btn btn-primary">
                                <i class="bi bi-plus"></i> Add Product
                            </button>
                        </div>
                        
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Image</th>
                                        <th>Name</th>
                                        <th>Price</th>
                                        <th>Stock</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="products-table-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Order Details Modal -->
    <div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Order Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="order-details-content">
                    <!-- Order details will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" id="mark-done-btn" class="btn btn-success">Mark as Done</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="productModalTitle">Add New Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm">
                        <input type="hidden" id="productId">
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" id="productCategory" required>
                                <option value="shirts">Shirts</option>
                                <option value="tshirts">T-Shirts</option>
                                <option value="pants-jeans">Pants & Jeans</option>
                                <option value="ethnic-wear">Ethnic Wear</option>
                                <option value="jackets-hoodies">Jackets & Hoodies</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" class="form-control" id="productName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="productDescription" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Price (PKR)</label>
                                <input type="number" step="0.01" class="form-control" id="productPrice" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Stock Quantity</label>
                                <input type="number" class="form-control" id="productStock" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Image URL</label>
                            <input type="url" class="form-control" id="productImageUrl" placeholder="https://example.com/image.jpg">
                            <div class="image-preview mt-2" id="imagePreview">
                                <span class="text-muted">No image selected</span>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="saveProductBtn" class="btn btn-primary">Save Product</button>
                </div>
            </div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script>
    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBVtKArFOnaNNSY1nEESXB3cU0uozrjObQ",
        authDomain: "dz-cartique.firebaseapp.com",
        projectId: "dz-cartique",
        storageBucket: "dz-cartique.appspot.com",
        messagingSenderId: "558727334092",
        appId: "1:558727334092:web:c5d3dee02a66e2a8c8da69"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // DOM elements
    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const usersTableBody = document.getElementById('users-table-body');
    const ordersList = document.getElementById('orders-list');
    const noOrdersMessage = document.getElementById('no-orders-message');
    const orderDetailsModal = new bootstrap.Modal(document.getElementById('orderDetailsModal'));
    const orderDetailsContent = document.getElementById('order-details-content');
    const markDoneBtn = document.getElementById('mark-done-btn');
    const productsTableBody = document.getElementById('products-table-body');
    const addProductBtn = document.getElementById('add-product-btn');
    const productModal = new bootstrap.Modal(document.getElementById('productModal'));
    const productForm = document.getElementById('productForm');
    const saveProductBtn = document.getElementById('saveProductBtn');
    const imagePreview = document.getElementById('imagePreview');
    const productImageUrl = document.getElementById('productImageUrl');

    // Global variables
    let currentUser = null;
    let currentSelectedUserId = null;
    let currentSelectedOrderId = null;
    let currentCategory = 'shirts';
    let editingProductId = null;

    // Login function
    loginBtn.addEventListener('click', () => {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        if (username === 'Hassnain' && password === 'D&ZCartique') {
            loginSection.style.display = 'none';
            dashboardSection.style.display = 'block';
            loadUsers();
        } else {
            document.getElementById('login-error').textContent = 'Invalid username or password';
        }
    });

    // Logout function
    logoutBtn.addEventListener('click', () => {
        loginSection.style.display = 'block';
        dashboardSection.style.display = 'none';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('login-error').textContent = '';
    });

    // Load all users from Firestore
    async function loadUsers() {
        usersTableBody.innerHTML = '<tr><td colspan="5" class="text-center">Loading users...</td></tr>';
        
        try {
            const querySnapshot = await db.collection('users').get();
            usersTableBody.innerHTML = '';
            
            if (querySnapshot.empty) {
                usersTableBody.innerHTML = '<tr><td colspan="5" class="text-center">No users found</td></tr>';
                return;
            }
            
            querySnapshot.forEach(doc => {
                const user = doc.data();
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${user.name || 'N/A'}</td>
                    <td>${user.email || 'N/A'}</td>
                    <td>${user.phone || 'N/A'}</td>
                    <td>${user.address || 'N/A'}</td>
                    <td>
                        <button class="btn btn-sm btn-primary view-orders-btn" data-user-id="${doc.id}">View Orders</button>
                    </td>
                `;
                usersTableBody.appendChild(row);
            });
            
            // Add event listeners to view orders buttons
            document.querySelectorAll('.view-orders-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    currentSelectedUserId = e.target.getAttribute('data-user-id');
                    loadUserOrders(currentSelectedUserId);
                    
                    // Switch to orders tab
                    const ordersTab = new bootstrap.Tab(document.getElementById('orders-tab'));
                    ordersTab.show();
                });
            });
        } catch (error) {
            console.error('Error loading users:', error);
            usersTableBody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">Error loading users</td></tr>';
        }
    }

    // Load orders for a specific user
    async function loadUserOrders(userId) {
        ordersList.innerHTML = '<div class="text-center">Loading orders...</div>';
        noOrdersMessage.style.display = 'none';
        
        try {
            // First determine the correct field name by checking a sample document
            const sampleQuery = await db.collection('orders').limit(1).get();
            let actualUserIdField = 'userId'; // default
            
            if (!sampleQuery.empty) {
                const sampleData = sampleQuery.docs[0].data();
                // Check for common variations of the user ID field
                if ('userID' in sampleData) actualUserIdField = 'userID';
                else if ('userId' in sampleData) actualUserIdField = 'userId';
                else if ('user_id' in sampleData) actualUserIdField = 'user_id';
                else if ('user' in sampleData) actualUserIdField = 'user';
            }

            console.log(`Using field name: ${actualUserIdField}`); // Debug output

            // Try with the detected field name
            let querySnapshot = await db.collection('orders')
                .where(actualUserIdField, '==', userId)
                .orderBy('createdAt', 'desc')
                .get();

            ordersList.innerHTML = '';
            
            if (querySnapshot.empty) {
                noOrdersMessage.textContent = 'No orders found for this user';
                noOrdersMessage.style.display = 'block';
                return;
            }
            
            querySnapshot.forEach(doc => {
                const order = doc.data();
                const orderDate = order.createdAt?.toDate 
                    ? order.createdAt.toDate() 
                    : new Date(order.createdAt || new Date());
                
                const orderCard = document.createElement('div');
                orderCard.className = `card order-card ${order.status === 'done' ? 'done' : ''}`;
                orderCard.innerHTML = `
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h5 class="card-title">Order #${doc.id.substring(0, 8)}</h5>
                                <p class="card-text mb-1">Date: ${orderDate.toLocaleString()}</p>
                                <p class="card-text">Items: ${order.items?.length || 0}</p>
                            </div>
                            <div>
                                <span class="badge ${order.status === 'done' ? 'bg-success' : 'bg-warning text-dark'}">
                                    ${order.status === 'done' ? 'Completed' : 'Pending'}
                                </span>
                                <button class="btn btn-sm btn-outline-primary mt-2 view-details-btn" data-order-id="${doc.id}">
                                    View Details
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                ordersList.appendChild(orderCard);
            });
            
            // Add event listeners
            document.querySelectorAll('.view-details-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    currentSelectedOrderId = e.target.getAttribute('data-order-id');
                    showOrderDetails(currentSelectedOrderId);
                });
            });
        } catch (error) {
            console.error('Error loading orders:', error);
            ordersList.innerHTML = `
                <div class="alert alert-danger">
                    Error loading orders: ${error.message}
                    <button class="btn btn-sm btn-warning mt-2" onclick="loadUserOrders('${userId}')">Retry</button>
                </div>
            `;
        }
    }

    // Show order details in modal
    async function showOrderDetails(orderId) {
        orderDetailsContent.innerHTML = '<p>Loading order details...</p>';
        markDoneBtn.style.display = 'none';
        orderDetailsModal.show();
        
        try {
            const doc = await db.collection('orders').doc(orderId).get();
            
            if (!doc.exists) {
                orderDetailsContent.innerHTML = '<p>Order not found</p>';
                return;
            }
            
            const order = doc.data();
            console.log('Full order details:', order); // Debug log
            
            // Handle both timestamp formats
            const orderDate = order.createdAt?.toDate 
                ? order.createdAt.toDate() 
                : new Date(order.createdAt || order.date || new Date());
            
            // Handle items array or single item
            const itemsArray = Array.isArray(order.items) 
                ? order.items 
                : (order.items ? [order.items] : []);
            
            let itemsHtml = '';
            
            if (itemsArray.length > 0) {
                itemsHtml = '<table class="table table-bordered"><thead><tr><th>Item</th><th>Price</th><th>Qty</th><th>Subtotal</th></tr></thead><tbody>';
                itemsArray.forEach(item => {
                    itemsHtml += `
                        <tr>
                            <td>${item.name || 'N/A'}</td>
                            <td>${item.price || 0}</td>
                            <td>${item.quantity || 1}</td>
                            <td>${(item.price || 0) * (item.quantity || 1)}</td>
                        </tr>
                    `;
                });
                itemsHtml += '</tbody></table>';
            }
            
            orderDetailsContent.innerHTML = `
                <div class="row mb-3">
                    <div class="col-md-6">
                        <h5>Order Information</h5>
                        <p><strong>Order ID:</strong> ${orderId}</p>
                        <p><strong>Date:</strong> ${orderDate.toLocaleString()}</p>
                        <p><strong>Status:</strong> <span class="badge ${order.status === 'done' ? 'bg-success' : 'bg-warning text-dark'}">
                            ${order.status === 'done' ? 'Completed' : 'Pending'}
                        </span></p>
                    </div>
                    <div class="col-md-6">
                        <h5>Payment & Shipping</h5>
                        <p><strong>Payment Method:</strong> ${order.paymentMethod || 'N/A'}</p>
                        <p><strong>Shipping Cost:</strong> ${order.shipping || 0}</p>
                        <p><strong>Total:</strong> ${calculateOrderTotal(order)}</p>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <h5>Shipping Address</h5>
                        <p>${order.shippingInfo?.address || order.address || 'N/A'}</p>
                    </div>
                </div>
                <div class="mt-3">
                    <h5>Order Items</h5>
                    ${itemsHtml || '<p>No items found</p>'}
                </div>
            `;
            
            // Only show "Mark as Done" button if order is not already done
            if (order.status !== 'done') {
                markDoneBtn.style.display = 'block';
            }
        } catch (error) {
            console.error('Error loading order details:', error);
            orderDetailsContent.innerHTML = `
                <p class="text-danger">Error loading order details: ${error.message}</p>
                <button class="btn btn-sm btn-warning" onclick="showOrderDetails('${orderId}')">Retry</button>
            `;
        }
    }

    // Calculate order total
    function calculateOrderTotal(order) {
        let total = 0;
        if (order.items && order.items.length > 0) {
            total = order.items.reduce((sum, item) => {
                return sum + ((item.price || 0) * (item.quantity || 1));
            }, 0);
        }
        total += order.shipping || 0;
        return total;
    }

    // ===== PRODUCTS MANAGEMENT ===== //

    // Initialize products when products tab is shown
    document.getElementById('products-tab').addEventListener('shown.bs.tab', () => {
        loadProducts(currentCategory);
    });

    // Category selection handler
    document.querySelectorAll('.list-group-item').forEach(item => {
        item.addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelector('.list-group-item.active').classList.remove('active');
            item.classList.add('active');
            currentCategory = item.getAttribute('data-category');
            document.getElementById('current-category').textContent = item.textContent;
            loadProducts(currentCategory);
        });
    });

    // Add product button
    addProductBtn.addEventListener('click', () => {
        editingProductId = null;
        document.getElementById('productModalTitle').textContent = 'Add New Product';
        productForm.reset();
        document.getElementById('productCategory').value = currentCategory;
        imagePreview.innerHTML = '<span class="text-muted">No image selected</span>';
        productModal.show();
    });

    // Image URL preview handler
    productImageUrl.addEventListener('input', (e) => {
        const url = e.target.value.trim();
        if (url) {
            imagePreview.innerHTML = `
                <img src="${url}" 
                     style="max-height: 100%; max-width: 100%;"
                     onerror="this.onerror=null;this.parentElement.innerHTML='<span class=\'text-danger\'>Invalid image URL</span>'">
            `;
        } else {
            imagePreview.innerHTML = '<span class="text-muted">No image selected</span>';
        }
    });

    // Save product handler
    saveProductBtn.addEventListener('click', async () => {
        const productData = {
            name: document.getElementById('productName').value,
            description: document.getElementById('productDescription').value,
            price: parseFloat(document.getElementById('productPrice').value),
            stock: parseInt(document.getElementById('productStock').value),
            imageUrl: productImageUrl.value.trim() || null,
            category: document.getElementById('productCategory').value,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        if (!editingProductId) {
            productData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        }

        try {
            if (editingProductId) {
                // Update existing product
                await db.collection('products').doc(editingProductId).update(productData);
            } else {
                // Add new product
                await db.collection('products').add(productData);
            }
            
            productModal.hide();
            loadProducts(currentCategory);
        } catch (error) {
            console.error("Error saving product:", error);
            alert("Failed to save product: " + error.message);
        }
    });

async function loadProducts(category) {
    console.log(`Loading products for category: ${category}`); // Debug log
    productsTableBody.innerHTML = '<tr><td colspan="5" class="text-center">Loading products...</td></tr>';
    
    try {
        const querySnapshot = await db.collection('products')
            .where('category', '==', category)
            .orderBy('createdAt', 'desc')
            .get();
        
        console.log(`Found ${querySnapshot.size} products`); // Debug log
        
        productsTableBody.innerHTML = '';
        
        if (querySnapshot.empty) {
            productsTableBody.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center text-muted">
                        No products found in ${category} category.
                        <div class="mt-2">
                            <button class="btn btn-sm btn-primary" 
                                    onclick="document.getElementById('add-product-btn').click()">
                                Add First Product
                            </button>
                        </div>
                    </td>
                </tr>
            `;
            return;
        }
        
        querySnapshot.forEach(doc => {
            const product = doc.data();
            const productDate = product.createdAt?.toDate 
                ? product.createdAt.toDate().toLocaleDateString() 
                : 'No date';
            
            productsTableBody.innerHTML += `
                <tr>
                    <td>
                        <img src="${product.imageUrl || 'https://via.placeholder.com/50'}" 
                             width="50" height="50" 
                             style="object-fit:cover"
                             onerror="this.src='https://via.placeholder.com/50'">
                    </td>
                    <td>
                        <div class="fw-bold">${product.name}</div>
                        <small class="text-muted">${productDate}</small>
                    </td>
                    <td>PKR${product.price.toFixed(2)}</td>
                    <td>
                        <span class="badge ${product.stock > 0 ? 'bg-success' : 'bg-danger'}">
                            ${product.stock} available
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary edit-product" 
                                data-id="${doc.id}">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger delete-product"
                                data-id="${doc.id}">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
        });

    } catch (error) {
        console.error("Firestore error:", error); // Detailed error log
        productsTableBody.innerHTML = `
            <tr>
                <td colspan="5" class="text-center text-danger">
                    <div>Failed to load products</div>
                    <small class="text-muted">${error.message}</small>
                    <div class="mt-2">
                        <button class="btn btn-sm btn-warning" 
                                onclick="loadProducts('${category}')">
                            <i class="bi bi-arrow-repeat"></i> Try Again
                        </button>
                    </div>
                </td>
            </tr>
        `;
    }
}  // Mark order as done
    markDoneBtn.addEventListener('click', async () => {
        if (!currentSelectedOrderId) return;
        
        try {
            await db.collection('orders').doc(currentSelectedOrderId).update({
                status: 'done',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            orderDetailsModal.hide();
            loadUserOrders(currentSelectedUserId);
        } catch (error) {
            console.error('Error updating order:', error);
            alert('Failed to update order status');
        }
    });

    // Initialize the app
    document.addEventListener('DOMContentLoaded', () => {
        // Check if user is already logged in (for page refresh)
        const username = document.getElementById('username').value;
        if (username === 'Hassnain') {
            loginSection.style.display = 'none';
            dashboardSection.style.display = 'block';
            loadUsers();
        }
    });
</script>
</body>
</html>
