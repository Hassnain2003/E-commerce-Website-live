<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - D&Z Cartique</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header Section -->
    <header>
<a href="index.html" class="logo">
    <h1>D&Z Cartique</h1>
</a>

        <div class="header-links">
            <a href="index.html">Home</a>
            <a href="#">Shop</a>
            <a href="cart.html">Cart <span class="cart-counter">0</span></a>
            <div class="profile-dropdown">
                <a href="#" class="profile-link">
                    <i class="fas fa-user"></i>
                    <span class="username">Guest</span>
                </a>
                <div class="dropdown-content">
                    <div class="user-info">
                        <p>Welcome, <span class="username">Guest</span></p>
                    </div>
                    <a href="#" id="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Cart Content -->
    <div class="cart-container">
        <div class="cart-header">
            <h1 class="cart-title">Your Shopping Cart</h1>
        </div>

        <div id="cart-items-container" class="cart-items">
            <!-- Cart items will be dynamically inserted here -->
            <div class="empty-cart">
                <i class="fas fa-shopping-cart"></i>
                <p>Your cart is empty</p>
                <a href="index.html" class="continue-shopping">Continue Shopping</a>
            </div>
        </div>

        <div id="cart-summary" class="cart-summary" style="display: none;">
            <h2 class="summary-title">Order Summary</h2>
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">$0.00</span>
            </div>
            <div class="summary-row">
                <span>Shipping</span>
                <span>$5.00</span>
            </div>
            <div class="summary-row total-row">
                <span>Total</span>
                <span id="total">$0.00</span>
            </div>
            <button id="checkout-btn" class="checkout-btn">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2025 D&Z Cartique. All rights reserved.</p>
        <div>
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
            <a href="#">Contact Us</a>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBVtKArFOnaNNSY1nEESXB3cU0uozrjObQ",
            authDomain: "dz-cartique.firebaseapp.com",
            projectId: "dz-cartique",
            storageBucket: "dz-cartique.appspot.com",
            messagingSenderId: "558727334092",
            appId: "1:558727334092:web:c5d3dee02a66e2a8c8da69"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Check authentication state
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const userData = userDoc.data();
                        document.querySelectorAll('.username').forEach(el => {
                            el.textContent = userData.name || user.email;
                        });
                    }
                } catch (error) {
                    console.error("Error fetching user data:", error);
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        // Logout functionality
        document.getElementById("logout").addEventListener("click", async (e) => {
            e.preventDefault();
            try {
                await signOut(auth);
                window.location.href = 'login.html';
            } catch (error) {
                console.error("Logout error:", error);
            }
        });

        // Load cart items
        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartContainer = document.getElementById('cart-items-container');
            const cartSummary = document.getElementById('cart-summary');

            if (cart.length === 0) {
                cartContainer.innerHTML = `
                    <div class="empty-cart">
                        <i class="fas fa-shopping-cart"></i>
                        <p>Your cart is empty</p>
                        <a href="index.html" class="continue-shopping">Continue Shopping</a>
                    </div>
                `;
                cartSummary.style.display = 'none';
                updateCartCount();
                return;
            }

            let cartHTML = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;

                cartHTML += `
                    <div class="cart-item" data-id="${item.id}">
                        <img src="https://via.placeholder.com/200" alt="${item.name}" class="item-image">
                        <div class="item-details">
                            <h3 class="item-name">${item.name}</h3>
                            <div class="item-price">$${item.price.toFixed(2)}</div>
                            <div class="item-stock">In Stock</div>
                            <div class="item-quantity">
                                <button class="quantity-btn minus" data-index="${index}">-</button>
                                <input type="number" value="${item.quantity}" min="1" class="quantity-input" data-index="${index}">
                                <button class="quantity-btn plus" data-index="${index}">+</button>
                            </div>
                        </div>
                        <button class="remove-item" data-index="${index}">
                            <i class="fas fa-trash"></i> Remove
                        </button>
                    </div>
                `;
            });

            cartContainer.innerHTML = cartHTML;
            cartSummary.style.display = 'block';
            document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('total').textContent = `$${(subtotal + 5).toFixed(2)}`;

            // Add event listeners for quantity changes
            document.querySelectorAll('.quantity-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    const index = e.target.getAttribute('data-index');
                    updateQuantity(index, e.target.classList.contains('plus') ? 1 : -1);
                });
            });

            document.querySelectorAll('.quantity-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const index = e.target.getAttribute('data-index');
                    updateQuantity(index, 0, parseInt(e.target.value));
                });
            });

            // Add event listeners for remove item
            document.querySelectorAll('.remove-item').forEach(button => {
                button.addEventListener('click', (e) => {
                    const index = e.target.getAttribute('data-index');
                    removeItem(index);
                });
            });

            updateCartCount();
        }

        function updateQuantity(index, change, newQuantity = null) {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            if (newQuantity !== null) {
                cart[index].quantity = newQuantity;
            } else {
                cart[index].quantity += change;
                if (cart[index].quantity < 1) cart[index].quantity = 1;
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }

        function removeItem(index) {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const count = cart.reduce((total, item) => total + item.quantity, 0);
            document.querySelector('.cart-counter').textContent = count;
        }

        // Proceed to checkout
        document.getElementById('checkout-btn').addEventListener('click', () => {
            window.location.href = 'checkout.html';
        });

        // Initialize the page
        loadCart();
    </script>
</body>
</html>
